# cargo-deny configuration (run: `cargo deny check`)
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "Temporarily accepted: casper-types 7.1.1 pins k256 0.13; upgrading crypto-bigint requires a compatible cryptography dependency migration." },
    { id = "RUSTSEC-2025-0141", reason = "Transitive dependency of casper-binary-port 1.2.1; no safe drop-in upgrade. Reassess when Casper updates its binary-port dependency." },
]

[licenses]
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
